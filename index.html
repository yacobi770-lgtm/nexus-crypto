<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>NEXUS — איתותי קריפטו</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=JetBrains+Mono:wght@400;500&family=Heebo:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg0:#020408;--bg1:#060d16;--bg2:#0b1626;--bg3:#101f35;
  --border:#152a45;--border2:#1e3d60;
  --neon:#00c8f0;--neon3:rgba(0,200,240,.06);
  --buy:#00e87a;--buy2:rgba(0,232,122,.12);--buy3:rgba(0,232,122,.06);
  --sell:#ff3355;--sell2:rgba(255,51,85,.12);--sell3:rgba(255,51,85,.06);
  --wait:#f0a800;--wait2:rgba(240,168,0,.1);
  --t1:#d0e8ff;--t2:#6b8fb5;--t3:#2a4a6e;
  --r:6px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg0);color:var(--t1);font-family:'Heebo',sans-serif;font-size:14px;min-height:100vh}
body::before{content:'';position:fixed;inset:0;z-index:0;
  background:radial-gradient(ellipse 70% 50% at 10% 10%,rgba(0,80,200,.08) 0%,transparent 60%),
  radial-gradient(ellipse 50% 40% at 90% 80%,rgba(0,180,240,.06) 0%,transparent 55%);pointer-events:none}
body::after{content:'';position:fixed;inset:0;z-index:0;
  background-image:linear-gradient(rgba(0,200,240,.025) 1px,transparent 1px),
  linear-gradient(90deg,rgba(0,200,240,.025) 1px,transparent 1px);
  background-size:48px 48px;pointer-events:none}
.shell{position:relative;z-index:2;min-height:100vh;display:flex;flex-direction:column}

/* NAV */
nav{height:54px;display:flex;align-items:center;gap:10px;padding:0 16px;
  background:rgba(6,13,22,.95);border-bottom:1px solid var(--border);
  backdrop-filter:blur(16px);position:sticky;top:0;z-index:200}
.logo{font-family:'Orbitron',monospace;font-size:.95rem;font-weight:900;
  letter-spacing:.2em;color:var(--neon);text-shadow:0 0 12px rgba(0,200,240,.4)}
.nav-links{display:flex;gap:3px;margin-right:12px}
.nlink{font-family:'JetBrains Mono',monospace;font-size:.62rem;letter-spacing:.1em;
  color:var(--t2);background:transparent;border:1px solid transparent;
  padding:.28rem .6rem;border-radius:var(--r);cursor:pointer;
  transition:all .15s;text-transform:uppercase;text-decoration:none}
.nlink:hover,.nlink.active{color:var(--neon);border-color:var(--border2);background:var(--neon3)}
.nsp{flex:1}
.clk{font-family:'JetBrains Mono',monospace;font-size:.65rem;color:var(--t2)}
.clk b{color:var(--neon)}
.live{display:flex;align-items:center;gap:5px;font-family:'JetBrains Mono',monospace;font-size:.6rem;color:var(--buy)}
.ldot{width:6px;height:6px;border-radius:50%;background:var(--buy);box-shadow:0 0 6px var(--buy);animation:lp 2s ease-in-out infinite}
@keyframes lp{0%,100%{opacity:1}50%{opacity:.3}}
.nbtn{font-family:'JetBrains Mono',monospace;font-size:.6rem;letter-spacing:.1em;
  color:var(--t2);background:transparent;border:1px solid var(--border2);
  padding:.28rem .6rem;border-radius:var(--r);cursor:pointer;transition:all .15s;text-transform:uppercase}
.nbtn:hover{color:var(--neon);border-color:var(--neon);background:var(--neon3)}
.nbtn:disabled{opacity:.4;cursor:default}
.sweep-btn{border-color:var(--neon);color:var(--neon);background:var(--neon3)}
.sweep-btn:hover{box-shadow:0 0 10px rgba(0,200,240,.3)}

/* PAGES */
.page{display:none;flex:1;flex-direction:column}
.page.active{display:flex}

/* ══ DASHBOARD ══ */
.dash-wrap{padding:16px;display:flex;flex-direction:column;gap:14px;flex:1}

/* Stats row */
.stats-row{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:600px){.stats-row{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);
  padding:12px 14px;position:relative;overflow:hidden}
.stat::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--neon),transparent);opacity:.35}
.stat-lbl{font-family:'JetBrains Mono',monospace;font-size:.55rem;letter-spacing:.18em;
  color:var(--t2);text-transform:uppercase;margin-bottom:5px}
.stat-val{font-family:'Orbitron',monospace;font-size:1.4rem;font-weight:700;line-height:1}
.prog{height:3px;background:var(--bg3);border-radius:2px;overflow:hidden;margin-top:8px}
.prog-inner{height:100%;background:linear-gradient(90deg,#0050cc,var(--neon));
  box-shadow:0 0 6px rgba(0,200,240,.4);transition:width 1s ease}

/* Controls */
.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.search-box{flex:1;min-width:160px;max-width:260px;
  background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);
  color:var(--t1);font-family:'Heebo',sans-serif;font-size:.82rem;
  padding:.38rem .7rem;outline:none;transition:border-color .2s}
.search-box::placeholder{color:var(--t3)}
.search-box:focus{border-color:var(--neon)}
.fpills{display:flex;gap:5px}
.fp{font-family:'JetBrains Mono',monospace;font-size:.58rem;letter-spacing:.08em;
  padding:.28rem .55rem;border-radius:var(--r);border:1px solid var(--border);
  background:transparent;color:var(--t2);cursor:pointer;transition:all .13s}
.fp:hover{border-color:var(--neon);color:var(--neon)}
.fp.fa{border-color:var(--neon);color:var(--neon);background:var(--neon3)}
.fp.fb{border-color:var(--buy);color:var(--buy);background:var(--buy3)}
.fp.fs{border-color:var(--sell);color:var(--sell);background:var(--sell3)}
.fp.fw{border-color:var(--wait);color:var(--wait);background:var(--wait2)}
.cnt{margin-right:auto;font-family:'JetBrains Mono',monospace;font-size:.58rem;color:var(--t3)}

/* Signal Cards Grid */
.cards-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
  gap:10px;
  overflow-y:auto;
  max-height:calc(100vh - 280px);
  padding-bottom:4px;
}
@media(min-width:900px){.cards-grid{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}}

/* THE SIGNAL CARD */
.scard{
  background:var(--bg2);
  border:1px solid var(--border);
  border-radius:var(--r);
  padding:12px 14px;
  position:relative;
  overflow:hidden;
  animation:cin .25s ease both;
  display:flex;
  flex-direction:column;
  gap:9px;
  transition:border-color .2s,box-shadow .2s;
}
.scard:hover{box-shadow:0 2px 20px rgba(0,0,0,.4)}
.scard.c-buy {border-right:3px solid var(--buy); }
.scard.c-sell{border-right:3px solid var(--sell);}
.scard.c-wait{border-right:3px solid var(--wait);}
@keyframes cin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* Card top row */
.ct{display:flex;align-items:center;justify-content:space-between;gap:6px}
.cpair{font-family:'Orbitron',monospace;font-size:.95rem;font-weight:900;
  color:var(--neon);text-shadow:0 0 8px rgba(0,200,240,.3);letter-spacing:.06em}
.cdir{font-family:'Orbitron',monospace;font-size:.72rem;font-weight:700;
  padding:.18rem .55rem;border-radius:3px;letter-spacing:.08em}
.dl{background:var(--buy2);color:var(--buy);border:1px solid rgba(0,232,122,.3)}
.ds{background:var(--sell2);color:var(--sell);border:1px solid rgba(255,51,85,.3)}
.dw{background:var(--wait2);color:var(--wait);border:1px solid rgba(240,168,0,.25)}

/* Price row */
.price-row{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pfield{background:var(--bg3);border:1px solid var(--border);border-radius:4px;padding:7px 9px}
.pf-lbl{font-family:'JetBrains Mono',monospace;font-size:.52rem;letter-spacing:.13em;
  color:var(--t2);text-transform:uppercase;margin-bottom:3px}
.pf-val{font-family:'Orbitron',monospace;font-size:.78rem;font-weight:700}

/* Targets row */
.trow{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.tfield{background:rgba(0,200,240,.04);border:1px solid rgba(0,200,240,.12);
  border-radius:4px;padding:6px 8px;text-align:center}
.tf-lbl{font-family:'JetBrains Mono',monospace;font-size:.5rem;color:var(--t3);
  letter-spacing:.1em;margin-bottom:2px}
.tf-val{font-family:'Orbitron',monospace;font-size:.7rem;color:var(--neon);font-weight:700}

/* Reason + meta */
.creason{font-size:.78rem;color:var(--t2);line-height:1.4;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cmeta{display:flex;align-items:center;justify-content:space-between;
  padding-top:7px;border-top:1px solid var(--border)}
.clev{font-family:'Orbitron',monospace;font-size:.7rem;font-weight:700;color:var(--wait)}
.csrc{font-family:'JetBrains Mono',monospace;font-size:.55rem;color:var(--t3)}
.ctime{font-family:'JetBrains Mono',monospace;font-size:.55rem;color:var(--t3)}

/* Empty/loading */
.empty-state{grid-column:1/-1;text-align:center;padding:4rem 1rem}
.esp{font-family:'JetBrains Mono',monospace;font-size:.68rem;color:var(--t2);letter-spacing:.14em;margin-top:.8rem}
.spin{width:24px;height:24px;border:2px solid var(--border2);border-top-color:var(--neon);
  border-radius:50%;animation:sp .65s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}

/* ══ NEWS PAGE ══ */
.news-wrap{padding:16px;display:flex;flex-direction:column;gap:14px;flex:1}
.news-hdr{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.news-title{font-family:'Orbitron',monospace;font-size:.95rem;font-weight:700;
  letter-spacing:.15em;color:var(--neon)}
.news-cnt{font-family:'JetBrains Mono',monospace;font-size:.62rem;color:var(--t2);
  background:var(--bg3);border:1px solid var(--border);padding:.22rem .55rem;border-radius:var(--r)}
.news-grid{display:grid;grid-template-columns:1fr;gap:8px;overflow-y:auto;max-height:calc(100vh - 180px)}
@media(min-width:600px){.news-grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1000px){.news-grid{grid-template-columns:repeat(3,1fr)}}
.ncard{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);
  padding:12px 14px;display:flex;flex-direction:column;gap:7px;animation:cin .3s ease both}
.ncard:hover{border-color:var(--border2)}
.nc-src{display:flex;align-items:center;gap:6px}
.nc-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.nc-name{font-family:'JetBrains Mono',monospace;font-size:.57rem;letter-spacing:.1em;color:var(--t2)}
.nc-hot{font-family:'JetBrains Mono',monospace;font-size:.52rem;color:var(--sell);
  background:rgba(255,51,85,.1);border:1px solid rgba(255,51,85,.2);
  padding:.1rem .38rem;border-radius:2px}
.nc-title{font-size:.8rem;color:var(--t1);line-height:1.5;font-weight:300;direction:ltr;text-align:left}
.nc-btn{font-family:'JetBrains Mono',monospace;font-size:.57rem;letter-spacing:.08em;
  color:var(--neon);background:var(--neon3);border:1px solid rgba(0,200,240,.25);
  padding:.18rem .5rem;border-radius:2px;cursor:pointer;transition:all .13s;
  align-self:flex-start}
.nc-btn:hover{background:rgba(0,200,240,.15)}

/* Toast */
.toast{position:fixed;bottom:18px;right:18px;z-index:9999;
  background:var(--bg2);border:1px solid var(--neon);border-right:3px solid var(--neon);
  color:var(--neon);font-family:'JetBrains Mono',monospace;font-size:.63rem;
  padding:.5rem 1rem;border-radius:var(--r);
  opacity:0;transform:translateX(-12px);transition:opacity .2s,transform .2s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(0)}

::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:var(--bg0)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
::-webkit-scrollbar-thumb:hover{background:var(--neon)}
</style>
</head>
<body>
<div class="shell">

<nav>
  <div class="logo">NEXUS</div>
  <div class="nav-links">
    <a class="nlink active" id="nav-dash" onclick="showPage('dash')">📊 איתותים</a>
    <a class="nlink" id="nav-news" onclick="showPage('news')">🔥 חדשות</a>
  </div>
  <div class="nsp"></div>
  <div class="live"><span class="ldot"></span>חי</div>
  <div class="clk" id="clk">UTC <b>--:--:--</b></div>
  <button class="nbtn sweep-btn" id="sweep-btn" onclick="triggerJob()">▶ סריקה</button>
  <button class="nbtn" onclick="loadSignals()">⟳</button>
</nav>

<!-- DASHBOARD -->
<div class="page active" id="page-dash">
<div class="dash-wrap">

  <div class="stats-row">
    <div class="stat">
      <div class="stat-lbl">איתותים היום</div>
      <div class="stat-val" style="color:var(--neon)" id="s-today">–</div>
      <div class="prog"><div class="prog-inner" id="prog" style="width:0%"></div></div>
    </div>
    <div class="stat">
      <div class="stat-lbl">כיוון שוק</div>
      <div class="stat-val" id="regime" style="color:var(--t2);font-size:1rem">–</div>
    </div>
    <div class="stat">
      <div class="stat-lbl">BUY / SELL / WAIT</div>
      <div style="display:flex;gap:8px;align-items:baseline;margin-top:4px">
        <span style="font-family:'Orbitron',monospace;font-size:1.1rem;color:var(--buy)" id="cb">0</span>
        <span style="font-family:'Orbitron',monospace;font-size:1.1rem;color:var(--sell)" id="cs">0</span>
        <span style="font-family:'Orbitron',monospace;font-size:1.1rem;color:var(--wait)" id="cw">0</span>
      </div>
    </div>
    <div class="stat">
      <div class="stat-lbl">סנכרון אחרון</div>
      <div class="stat-val" style="font-size:.9rem;color:var(--t1)" id="s-sync">–</div>
    </div>
  </div>

  <div class="controls">
    <input class="search-box" type="search" id="srch" placeholder="🔍 חפש מטבע…" oninput="applyF()"/>
    <div class="fpills">
      <button class="fp fa" onclick="setF('ALL',this)">הכל</button>
      <button class="fp" onclick="setF('BUY',this)">קנה</button>
      <button class="fp" onclick="setF('SELL',this)">מכור</button>
      <button class="fp" onclick="setF('WAIT',this)">המתן</button>
    </div>
    <div class="cnt" id="cnt">– איתותים</div>
  </div>

  <div class="cards-grid" id="cards"></div>

</div>
</div>

<!-- NEWS -->
<div class="page" id="page-news">
<div class="news-wrap">
  <div class="news-hdr">
    <div class="news-title">🔥 חדשות חמות</div>
    <span class="news-cnt" id="news-cnt">טוען…</span>
    <button class="nbtn" onclick="loadNews()">⟳ רענן</button>
  </div>
  <div class="news-grid" id="news-grid">
    <div class="empty-state" style="grid-column:1/-1">
      <div class="spin" style="margin:0 auto .8rem"></div>
      <div class="esp">טוען חדשות…</div>
    </div>
  </div>
</div>
</div>

</div>
<div class="toast" id="toast"></div>

<script>
let allSig=[], activeF='ALL', allNews=[];

// Clock
function tick(){document.getElementById('clk').innerHTML='UTC <b>'+new Date().toUTCString().split(' ')[4]+'</b>'}
tick(); setInterval(tick,1000);

// Page
function showPage(p){
  document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.nlink').forEach(x=>x.classList.remove('active'));
  document.getElementById('page-'+p).classList.add('active');
  document.getElementById('nav-'+p).classList.add('active');
  if(p==='news'&&!allNews.length)loadNews();
}

// Toast
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2800)}

// Escape
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

// Format
function fmt(v){if(!v||v==='NA')return '–';return '$'+esc(v)}
function fmtTime(ts){
  if(!ts)return'–';
  try{return new Date(ts.replace(' ','T')+'Z').toLocaleTimeString('he-IL',{hour12:false,timeZone:'Asia/Jerusalem'});}catch{return ts}
}

// Render cards
function renderCards(sigs){
  const el=document.getElementById('cards');
  document.getElementById('cnt').textContent=sigs.length+' איתותים';
  if(!sigs.length){
    el.innerHTML='<div class="empty-state"><div class="esp">אין איתותים תואמים</div></div>';
    return;
  }
  const CC={BUY:'c-buy',SELL:'c-sell',WAIT:'c-wait'};
  const DC={'ארוך':'dl','קצר':'ds','המתן':'dw'};
  el.innerHTML=sigs.map((s,i)=>{
    const cc=CC[s.signal]||'c-wait';
    const dir=s.direction||'המתן';
    const dc=DC[dir]||'dw';
    const lev=s.leverage&&s.leverage!=='NA'?s.leverage:'x10';
    return '<div class="scard '+cc+'" style="animation-delay:'+(i*.04)+'s">'
      // Top
      +'<div class="ct">'
        +'<span class="cpair">'+esc(s.symbol||'CRYPTO/USDT')+'</span>'
        +'<span class="cdir '+dc+'">'+dir+'</span>'
      +'</div>'
      // Prices
      +'<div class="price-row">'
        +'<div class="pfield"><div class="pf-lbl">כניסה</div><div class="pf-val" style="color:var(--neon)">'+fmt(s.entry)+'</div></div>'
        +'<div class="pfield"><div class="pf-lbl">סטופ</div><div class="pf-val" style="color:var(--sell)">'+fmt(s.stop_loss)+'</div></div>'
        +'<div class="pfield"><div class="pf-lbl">מינוף</div><div class="pf-val" style="color:var(--wait)">'+esc(lev)+'</div></div>'
      +'</div>'
      // Targets
      +'<div class="trow">'
        +'<div class="tfield"><div class="tf-lbl">מטרה 1</div><div class="tf-val">'+fmt(s.target1)+'</div></div>'
        +'<div class="tfield"><div class="tf-lbl">מטרה 2</div><div class="tf-val">'+fmt(s.target2)+'</div></div>'
        +'<div class="tfield"><div class="tf-lbl">מטרה 3</div><div class="tf-val">'+fmt(s.target3)+'</div></div>'
      +'</div>'
      // Reason
      +'<div class="creason">💡 '+esc(s.reason)+'</div>'
      // Meta
      +'<div class="cmeta">'
        +'<span class="clev">'+esc(lev)+'</span>'
        +'<span class="csrc">'+esc(s.source||'')+'</span>'
        +'<span class="ctime">'+fmtTime(s.timestamp)+'</span>'
      +'</div>'
    +'</div>';
  }).join('');
}

// Sidebar stats
function updateStats(sigs,stats){
  const bc=sigs.filter(s=>s.signal==='BUY').length;
  const sc=sigs.filter(s=>s.signal==='SELL').length;
  const wc=sigs.filter(s=>s.signal==='WAIT').length;
  document.getElementById('cb').textContent=bc;
  document.getElementById('cs').textContent=sc;
  document.getElementById('cw').textContent=wc;
  document.getElementById('s-today').textContent=stats.today||0;
  document.getElementById('prog').style.width=Math.min(100,(stats.today/stats.daily_limit)*100)+'%';
  const rv=document.getElementById('regime');
  if(bc>sc&&bc>wc){rv.textContent='שוורי 📈';rv.style.color='var(--buy)'}
  else if(sc>bc&&sc>wc){rv.textContent='דובי 📉';rv.style.color='var(--sell)'}
  else{rv.textContent='נייטרלי ⚖️';rv.style.color='var(--wait)'}
}

// Filters
function setF(v,btn){
  activeF=v;
  document.querySelectorAll('.fp').forEach(p=>p.className='fp');
  const m={ALL:'fa',BUY:'fb',SELL:'fs',WAIT:'fw'};
  btn.classList.add(m[v]||'fa');
  applyF();
}
function applyF(){
  const q=document.getElementById('srch').value.toLowerCase().trim();
  let f=allSig;
  if(activeF!=='ALL')f=f.filter(s=>s.signal===activeF);
  if(q)f=f.filter(s=>(s.symbol||'').toLowerCase().includes(q)||(s.news_title||'').toLowerCase().includes(q)||(s.reason||'').toLowerCase().includes(q));
  renderCards(f);
}

// Load signals
async function loadSignals(){
  try{
    const [r1,r2]=await Promise.all([fetch('/api/signals'),fetch('/api/stats')]);
    allSig=await r1.json();
    const st=await r2.json();
    document.getElementById('s-sync').textContent=new Date().toLocaleTimeString('he-IL',{hour12:false,timeZone:'Asia/Jerusalem'});
    updateStats(allSig,st);
    applyF();
  }catch(e){console.error(e);toast('⚠ שגיאה בטעינת נתונים')}
}

// Trigger
async function triggerJob(){
  const btn=document.getElementById('sweep-btn');
  btn.disabled=true;btn.textContent='⏳ סורק…';
  try{
    const r=await fetch('/api/trigger',{method:'POST'});
    if(r.ok){toast('✓ סריקה הושלמה — מרענן…');setTimeout(loadSignals,4000);}
    else toast('⚠ הסריקה נכשלה');
  }catch{toast('⚠ שגיאת רשת')}
  finally{btn.disabled=false;btn.textContent='▶ סריקה'}
}

// News
const SRC_C={CoinDesk:'#f59e0b',Cointelegraph:'#00c8f0','Bitcoin.com':'#f97316',Bitcoinist:'#a78bfa',CryptoNews:'#34d399'};
async function loadNews(){
  document.getElementById('news-grid').innerHTML='<div class="empty-state" style="grid-column:1/-1"><div class="spin" style="margin:0 auto .8rem"></div><div class="esp">טוען…</div></div>';
  try{
    const r=await fetch('/api/news');
    allNews=await r.json();
    document.getElementById('news-cnt').textContent=allNews.length+' חדשות';
    document.getElementById('news-grid').innerHTML=allNews.map((n,i)=>{
      const col=SRC_C[n.source]||'#6b8fb5';
      return '<div class="ncard" style="animation-delay:'+(i*.03)+'s">'
        +'<div class="nc-src"><div class="nc-dot" style="background:'+col+'"></div>'
        +'<div class="nc-name">'+esc(n.source)+'</div>'
        +(i<10?'<span class="nc-hot">🔥 חם</span>':'')
        +'</div>'
        +'<div class="nc-title">'+esc(n.title)+'</div>'
        +'<button class="nc-btn" onclick="triggerJob()">⚡ נתח עכשיו</button>'
      +'</div>';
    }).join('');
  }catch(e){toast('⚠ שגיאה בטעינת חדשות')}
}

loadSignals();
setInterval(loadSignals,120000);
</script>
</body>
</html>
